          Path('.artifacts/external-helper/physics_compare.cpp').write_text('#include "physics_owned_map.h"\n#include "physics_import.h"\n#include <game/mapbugs.h>\n#include <algorithm>\n#include <array>\n#include <fstream>\n#include <cstdio>\n#include <iterator>\n\nstruct TraceFrame { int Tick{},Id{}; CNetObj_PlayerInput Controls{};Replica::WorldFlags Flags{};std::vector<std::uint8_t> Character; };\nclass TraceReader {\n    std::vector<std::uint8_t> m_Data;std::size_t m_At=0;\npublic:\n    explicit TraceReader(const char *Path)\n    {\n        std::ifstream File(Path,std::ios::binary|std::ios::ate);Replica::Need(bool(File),"trace open");\n        const auto Size=File.tellg();Replica::Need(Size>=24 && Size<=2*1024*1024,"trace size");\n        m_Data.resize(static_cast<std::size_t>(Size));File.seekg(0);File.read(reinterpret_cast<char *>(m_Data.data()),Size);\n        Replica::Need(bool(File),"trace exact read");\n    }\n    std::span<const std::uint8_t> Take(std::size_t Count)\n    {\n        Replica::Need(m_At<=m_Data.size() && Count<=m_Data.size()-m_At,"trace field bound");\n        auto Result=std::span(m_Data).subspan(m_At,Count);m_At+=Count;return Result;\n    }\n    int Integer() { return Replica::Int(Take(4),0); }\n    bool End()const {return m_At==m_Data.size();}\n};\n\nint main(int Argc,char **Argv) try\n{\n    Replica::Need(Argc==2,"usage: physics-compare owned-trace.bin");\n    TraceReader Reader(Argv[1]);const auto Magic=Reader.Take(8);\n    Replica::Need(std::equal(Magic.begin(),Magic.end(),std::string_view("MALPTR01").begin()),"trace magic");\n    const int Width=Reader.Integer(),Height=Reader.Integer(),TileBytes=Reader.Integer(),Count=Reader.Integer();\n    Replica::Need(Width>0 && Height>0 && Width<=512 && Height<=512 && TileBytes==Width*Height*4 && Count>=2 && Count<=512,"trace geometry/count");\n    const auto RawTiles=Reader.Take(static_cast<std::size_t>(TileBytes));std::vector<std::uint8_t> Tiles(RawTiles.begin(),RawTiles.end());\n    std::vector<TraceFrame> Frames;\n    for(int Index=0;Index<Count;++Index)\n    {\n        TraceFrame Frame;Frame.Tick=Reader.Integer();Frame.Id=Reader.Integer();Frame.Controls=Replica::Input(Reader.Take(40),0);\n#define READ_FLAG(Name) do {const int Value=Reader.Integer();Replica::Need(Value==0 || Value==1,"world flag");Frame.Flags.Name=Value!=0;}while(false)\n        READ_FLAG(m_IsDDRace);READ_FLAG(m_IsVanilla);READ_FLAG(m_IsFNG);READ_FLAG(m_InfiniteAmmo);READ_FLAG(m_PredictTiles);\n        Frame.Flags.m_PredictFreeze=Reader.Integer();Replica::Need(Frame.Flags.m_PredictFreeze>=0 && Frame.Flags.m_PredictFreeze<=2,"predict freeze flag");\n        READ_FLAG(m_PredictWeapons);READ_FLAG(m_PredictDDRace);READ_FLAG(m_IsSolo);READ_FLAG(m_UseTuneZones);READ_FLAG(m_BugDDRaceInput);\n        READ_FLAG(m_NoWeakHookAndBounce);READ_FLAG(m_PredictEvents);READ_FLAG(m_OldLaser);READ_FLAG(m_PredictTeleports);\n#undef READ_FLAG\n        const auto RawCharacter=Reader.Take(RemoteLayout::sizeof_CCharacter);Frame.Character.assign(RawCharacter.begin(),RawCharacter.end());\n        Frames.push_back(std::move(Frame));\n    }\n    Replica::Need(Reader.End(),"trace trailing bytes");\n    int Compared=0,Failures=0,Skipped=0;double MaxPositionError=0,MaxVelocityError=0;\n    for(std::size_t Index=0;Index+1<Frames.size();++Index)\n    {\n        const auto &Before=Frames[Index],&After=Frames[Index+1];const int Steps=After.Tick-Before.Tick;\n        if(Before.Id!=After.Id || Steps<1 || Steps>8 || std::memcmp(&Before.Controls,&After.Controls,sizeof(Before.Controls))!=0){++Skipped;continue;}\n        CPhysicsOwnedMap Map(Width,Height,Tiles);CLayers Layers;Layers.Init(&Map,false,false);CCollision Collision;Collision.Init(&Layers);\n        std::array<CTuningParams,256> Tuning{};CMapBugs MapBugs;\n        CGameWorld World;World.Init(&Collision,Tuning.data(),&MapBugs);World.m_LocalClientId=Before.Id;World.m_GameTick=Before.Tick;\n        Replica::SetFlags(World,Before.Flags);Replica::ImportCharacter(World,Before.Character,Before.Id);\n        for(int Tick=0;Tick<Steps;++Tick)Replica::Step(World,Before.Id,Before.Controls);\n        const auto *Player=World.GetCharacterById(Before.Id);Replica::Need(Player!=nullptr,"replica character absent");const auto &Core=*Player->Core();\n        const auto Expected=std::span(After.Character).subspan(RemoteLayout::CCharacter::m_Core,RemoteLayout::sizeof_CCharacterCore);\n        const vec2 Position=Replica::Vector(Expected,RemoteLayout::CCharacterCore::m_Pos),Velocity=Replica::Vector(Expected,RemoteLayout::CCharacterCore::m_Vel);\n        const double PosError=distance(Core.m_Pos,Position),VelError=distance(Core.m_Vel,Velocity);\n        MaxPositionError=std::max(MaxPositionError,PosError);MaxVelocityError=std::max(MaxVelocityError,VelError);++Compared;\n        const bool Equal=Core.m_Pos==Position && Core.m_Vel==Velocity &&\n            Core.m_IsInFreeze==Replica::Bool(Expected,RemoteLayout::CCharacterCore::m_IsInFreeze) &&\n            Player->m_FreezeTime==Replica::Int(After.Character,RemoteLayout::CCharacter::m_FreezeTime);\n        if(!Equal)\n        {\n            ++Failures;\n            if(Failures<=12)std::printf("mismatch tick=%d steps=%d predicted=(%.3f,%.3f)/(%.3f,%.3f) observed=(%.3f,%.3f)/(%.3f,%.3f) freeze=%d/%d in_freeze=%d/%d\\n",Before.Tick,Steps,Core.m_Pos.x,Core.m_Pos.y,Core.m_Vel.x,Core.m_Vel.y,Position.x,Position.y,Velocity.x,Velocity.y,Player->m_FreezeTime,Replica::Int(After.Character,RemoteLayout::CCharacter::m_FreezeTime),Core.m_IsInFreeze,Replica::Bool(Expected,RemoteLayout::CCharacterCore::m_IsInFreeze));\n        }\n    }\n    std::printf("observed-state-replica comparison pairs=%d skipped_nonadjacent_or_input_changed=%d mismatches=%d max_position_error=%.9f max_velocity_error=%.9f; no game input\\n",Compared,Skipped,Failures,MaxPositionError,MaxVelocityError);\n    return Compared>20 && Failures==0 ? 0 : 1;\n}\ncatch(const std::exception &Error){std::fprintf(stderr,"replica check rejected: %s\\n",Error.what