          Path('.artifacts/external-helper/physics_generate_import.py').write_text('# Generate explicit primitive-field importers from a MEASURED pinned MSVC\n# layout. Never memcpy target STL objects, vtables, callbacks or pointers.\nfrom pathlib import Path\nimport json\nroot=Path(\'.artifacts/external-helper\');measured=json.loads((root/\'runtime-3-report.json\').read_text())[\'layout\']\nlines=[\'// Pinned cf192e3/MSVC19.44/x64, runtime acquisition43017692183/job130512762553.\',\n       \'// Object-relative offsets, NOT RVAs. Exact EXE SHA25650430c5f... required.\',\n       \'// Candidate replica importer, not yet an enabled production input adapter.\',\n       \'#pragma once\',\'#include <cstddef>\',\'namespace RemoteLayout {\']\nfor typ in [\'CCharacter\',\'CCharacterCore\',\'CEntity\']:\n    lines+=[\'namespace \'+typ+\' {\']\n    for member,offset in measured[\'private\'][typ].items():lines+=[\'inline constexpr std::size_t \'+member+\' = \'+str(offset)+\';\']\n    lines+=[\'}\']\nfor typ in [\'CCharacter\',\'CCharacterCore\',\'CTuningParams\',\'CNetObj_PlayerInput\']:\n    lines+=[\'inline constexpr std::size_t sizeof_\'+typ+\' = \'+str(measured[\'public\'][\'sizeof_\'+typ])+\';\']\nlines+=[\'}\']\n(root/\'physics_remote_layout.h\').write_text(\'\\n\'.join(lines)+\'\\n\')\n\n# Public/private categories come from the exact pinned character.h/gamecore.h,\n# not from a decompiler guess. All class-local private accesses affect OWNED\n# local replica objects only, using C++\'s explicit-instantiation access exception.\nchar_private_int=[\'m_NumObjectsHit\',\'m_LastWeapon\',\'m_QueuedWeapon\',\'m_ReloadTimer\',\'m_AttackTick\',\'m_MoveRestrictions\',\'m_PainSoundTimer\',\'m_NumInputs\',\'m_TuneZone\',\'m_TuneZoneOverride\',\'m_StrongWeakId\',\'m_LastWeaponSwitchTick\',\'m_LastTuneZoneTick\']\nchar_private_input=[\'m_LatestPrevInput\',\'m_LatestInput\',\'m_PrevInput\',\'m_Input\',\'m_SavedInput\']\nchar_public_int=[\'m_FreezeTime\',\'m_TeleCheckpoint\',\'m_TileIndex\',\'m_TileFIndex\',\'m_LastSnapWeapon\',\'m_GameTeam\',\'m_FreezeAccumulation\',\'m_AliveAccumulation\']\nchar_public_bool=[\'m_IsLocal\',\'m_NinjaJetpack\',\'m_FrozenLastTick\',\'m_LastRefillJumps\',\'m_KeepHooked\',\'m_CanMoveInFreeze\']\nchar_public_vec=[\'m_PrevPos\',\'m_PrevPrevPos\']\ncore_int=[\'m_HookTick\',\'m_HookState\',\'m_ActiveWeapon\',\'m_Jumped\',\'m_JumpedTotal\',\'m_Jumps\',\'m_Direction\',\'m_Angle\',\'m_TriggeredEvents\',\'m_Id\',\'m_Colliding\',\'m_FreezeStart\',\'m_FreezeEnd\']\ncore_bool=[\'m_NewHook\',\'m_Reset\',\'m_LeftWall\',\'m_Solo\',\'m_Jetpack\',\'m_CollisionDisabled\',\'m_EndlessHook\',\'m_EndlessJump\',\'m_HammerHitDisabled\',\'m_GrenadeHitDisabled\',\'m_LaserHitDisabled\',\'m_ShotgunHitDisabled\',\'m_HookHitDisabled\',\'m_Super\',\'m_Invincible\',\'m_HasTelegunGun\',\'m_HasTelegunGrenade\',\'m_HasTelegunLaser\',\'m_IsInFreeze\',\'m_DeepFrozen\',\'m_LiveFrozen\']\ncore_vec=[\'m_Pos\',\'m_Vel\',\'m_HookPos\',\'m_HookDir\',\'m_HookTeleBase\']\nworld_flags=[\'m_IsDDRace\',\'m_IsVanilla\',\'m_IsFNG\',\'m_InfiniteAmmo\',\'m_PredictTiles\',\'m_PredictFreeze\',\'m_PredictWeapons\',\'m_PredictDDRace\',\'m_IsSolo\',\'m_UseTuneZones\',\'m_BugDDRaceInput\',\'m_NoWeakHookAndBounce\',\'m_PredictEvents\',\'m_OldLaser\',\'m_PredictTeleports\']\ns=r\'\'\'#pragma once\n#include "physics_remote_layout.h"\n#include <game/client/prediction/entities/character.h>\n#include <bit>\n#include <span>\n#include <cstdint>\n#include <cmath>\n#include <limits>\n#include <stdexcept>\n\nnamespace Replica {\nclass Rejected : public std::runtime_error { public: using std::runtime_error::runtime_error; };\ninline void Need(bool Test, const char *Why) { if(!Test) throw Rejected(Why); }\ninline std::uint32_t U32(std::span<const std::uint8_t> Bytes, std::size_t At)\n{\n    Need(At <= Bytes.size() && Bytes.size()-At >= 4,"primitive field bound");\n    return std::uint32_t(Bytes[At]) | std::uint32_t(Bytes[At+1])<<8 | std::uint32_t(Bytes[At+2])<<16 | std::uint32_t(Bytes[At+