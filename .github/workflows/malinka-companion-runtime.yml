          Path('.artifacts/external-helper/physics_smoke.cpp').write_text('#include "physics_owned_map.h"\n#include <game/client/prediction/entities/character.h>\n#include <game/mapbugs.h>\n#include <array>\n#include <cstdio>\n#include <limits>\n\nint main()\n{\n    constexpr int Width=60, Height=50;\n    std::vector<std::uint8_t> Tiles(Width*Height*sizeof(CTile),0);\n    for(int Y=0;Y<Height;++Y) for(int X=0;X<Width;++X)\n    {\n        auto &Tile=Tiles[static_cast<std::size_t>((Y*Width+X)*sizeof(CTile))];\n        if(X==0 || X==Width-1 || Y==0 || Y>=47) Tile=TILE_SOLID;\n        else if(Y>=16 && X>=27 && X<=33) Tile=TILE_FREEZE;\n    }\n    for(int Direction=-1;Direction<=1;++Direction)\n    {\n        CPhysicsOwnedMap Map(Width,Height,Tiles);\n        CLayers Layers;Layers.Init(&Map,false,false);\n        CCollision Collision;Collision.Init(&Layers);\n        std::array<CTuningParams,256> Tuning{};\n        CMapBugs MapBugs;\n        CGameWorld World;World.Init(&Collision,Tuning.data(),&MapBugs);\n        World.m_GameTick=100;World.m_LocalClientId=0;\n        World.m_WorldConfig.m_IsDDRace=true;\n        World.m_WorldConfig.m_PredictTiles=true;\n        World.m_WorldConfig.m_PredictDDRace=true;\n        World.m_WorldConfig.m_PredictWeapons=true;\n        World.m_WorldConfig.m_PredictFreeze=1;\n        World.m_WorldConfig.m_PredictTeleports=false;\n        CNetObj_Character Character{};\n        Character.m_X=976;Character.m_Y=176;Character.m_HookedPlayer=-1;Character.m_Weapon=WEAPON_GUN;\n        CNetObj_DDNetCharacter Extended{};\n        CCharacter *Player=new CCharacter(&World,0,&Character,&Extended);\n        World.InsertEntity(Player);Player->m_IsLocal=true;\n        CNetObj_PlayerInput Input{};Input.m_TargetY=-1;Input.m_Direction=Direction;\n        int FirstFreeze=0;\n        for(int Step=1;Step<=80;++Step)\n        {\n            Player=World.GetCharacterById(0);if(!Player)return 2;\n            Player->OnDirectInput(&Input);\n            ++World.m_GameTick;\n            Player=World.GetCharacterById(0);if(!Player)return 3;\n            Player->OnPredictedInput(&Input);\n            World.Tick();\n            Player=World.GetCharacterById(0);if(!Player)return 4;\n            const auto Core=Player->GetCore();\n            if(!std::isfinite(Core.m_Pos.x) || !std::isfinite(Core.m_Pos.y))return 5;\n            if((Player->m_FreezeTime>0 || Core.m_IsInFreeze) && FirstFreeze==0)FirstFreeze=Step;\n        }\n        const auto Core=World.GetCharacterById(0)->GetCore();\n        std::printf("direction=%d first_freeze_step=%d pos=(%.3f,%.3f) vel=(%.3f,%.3f) freeze_time=%d\\n",Direction,FirstFreeze,Core.m_Pos.x,Core.m_Pos.y,Core.m_Vel.x,Core.m_Vel.y,World.GetCharacterById(0)->m_FreezeTime);\n        if((Direction==0)!=(FirstFreeze>0))return 6;\n    }\n    std::puts("Independent pinned-source simulation smoke passed; NOT an in-game Avoid check");\n    return 0;\n}\n',encoding="utf-8")
