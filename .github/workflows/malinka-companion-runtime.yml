          Path('runtime_owned_map.py').write_text("# Disposable SERVER-side test map. Never patches the official client or its\n# files. The unchanged client obtains it through the ordinary local server.\n# Format: pinned src/engine/shared/datafile.cpp and src/game/mapitems.h.\nimport hashlib, struct, zlib\n\ndef owned_freeze_map(original, layout):\n    assert 36<=len(original)<=2*1024*1024\n    magic,version,total,swap,nt,ni,nd,item_size,data_size=struct.unpack_from('<4s8i',original)\n    assert magic==b'DATA' and version==4 and total==len(original)-16\n    assert 0<nt<=64 and 0<ni<=4096 and 0<nd<=4096\n    item_offsets_at=36+nt*12;data_offsets_at=item_offsets_at+ni*4\n    raw_sizes_at=data_offsets_at+nd*4;item_start=raw_sizes_at+nd*4;data_start=item_start+item_size\n    assert data_start==swap+16 and data_start+data_size==len(original)\n    offsets=list(struct.unpack_from('<'+str(ni)+'i',original,item_offsets_at))\n    raw_offsets=list(struct.unpack_from('<'+str(nd)+'i',original,data_offsets_at))\n    sizes=list(struct.unpack_from('<'+str(nd)+'i',original,raw_sizes_at))\n    assert raw_offsets[0]==0 and raw_offsets==sorted(raw_offsets)\n    assert all(0<=size<=16*1024*1024 for size in sizes) and sum(sizes)<=64*1024*1024\n    layers=[]\n    for offset in offsets:\n        assert 0<=offset<=item_size-8\n        type_id,length=struct.unpack_from('<2i',original,item_start+offset)\n        assert 0<=length<=item_size-offset-8\n        if (type_id>>16)&0xffff!=layout['constant_MAPITEMTYPE_LAYER']:continue\n        data=original[item_start+offset+8:item_start+offset+8+length]\n        def field(name):return struct.unpack_from('<i',data,layout['CMapItemLayerTilemap_v2.'+name])[0]\n        if len(data)<layout['sizeof_CMapItemLayerTilemap_v2']:continue\n        layer_type=struct.unpack_from('<i',data,layout['CMapItemLayerTilemap_v2.m_Layer']+layout['CMapItemLayer.m_Type'])[0]\n        if layer_type!=layout['constant_LAYERTYPE_TILES']:continue\n        if field('m_Flags')&layout['constant_TILESLAYERFLAG_GAME']:\n            layers.append((field('m_Width'),field('m_Height'),field('m_Data')))\n    assert len(layers)==1\n    width,height,index=layers[0]\n    assert 24<=width<=512 and 24<=height<=512 and 0<=index<nd\n    assert layout['sizeof_CTile']==4 and sizes[index]==width*height*4\n    chunks=[]\n    for n,offset in enumerate(raw_offsets):\n        end=raw_offsets[n+1] if n+1<nd else data_size\n        assert 0<=offset<=end<=data_size\n        packed=original[data_start+offset:data_start+end]\n        decoder=zlib.decompressobj();decoded=decoder.decompress(packed,sizes[n]+1)\n        assert len(decoded)==sizes[n] and decoder.eof and not decoder.unconsumed_tail and not decoder.unused_data\n        chunks.append(packed)\n    tiles=bytearray(width*height*4)\n    spawn_x,spawn_y=width//2,5\n    freeze_y=height//3;ground_y=height-3\n    freeze_min_x,freeze_max_x=spawn_x-3,spawn_x+3\n    assert freeze_y>spawn_y+2 and freeze_y+4<ground_y\n    def put(x,y,kind):tiles[(y*width+x)*4+layout['CTile.m_Index']]=kind\n    for y in range(height):\n        for x in range(width):\n            if x==0 or x==width-1 or y==0 or y>=ground_y:put(x,y,layout['constant_TILE_SOLID'])\n            elif freeze_y<=y<ground_y and freeze_min_x<=x<=freeze_max_x:put(x,y,layout['constant_TILE_FREEZE'])\n    put(spawn_x,spawn_y,layout['constant_ENTITY_OFFSET']+layout['constant_ENTITY_SPAWN'])\n    chunks[index]=zlib.compress(bytes(tiles),9)\n    rebuilt=bytearray(original[:data_start]);new_offsets=[];position=0\n    for chunk in chunks:new_offsets.append(position);position+=len(chunk)\n    struct.pack_into('<i',rebuilt,8,data_start+position-16)\n    struct.pack_into('<i',rebuilt,32,position)\n    struct.pack_into('<'+str(nd)+'i',rebuilt,data_offsets_at,*new_offsets)\n    result=bytes(rebuilt)+b''.join(chunks)\n    assert len(result)==struct.unpack_from('<i',result,8)[0]+16\n    check=zlib.decompress(result[data_start+new_offsets[index]:data_start+new_offsets[index]+len(chunks[index])])\n    assert check==tiles\n    geometry={'width':width,'height':height,'spawn_tile':[spawn_x,spawn_y],\n              'spawn_center':[spawn_x*32+16,spawn_y*32+16],'freeze_rows':[freeze_y,ground_y-1],'freeze_columns':[freeze_min_x,freeze_max_x],\n              'ground_row':ground_y,'game_raw_index':index,'tile_bytes_sha256':hashlib.sha256(tiles).hexdigest(),\n              'map_sha256':hashlib.sha256(result).hexdigest(),'base_dm1_sha256':hashlib.sha256(original).hexdigest(),\n              'source':'BestProjectTeam/BestClient@cf192e3fb8590dbe2e4f66a191aa6616beff6975 datafile.cpp/mapitems.h',\n              'client_files_patched':False}\n    return result,geometry\n",encoding="utf-8")
