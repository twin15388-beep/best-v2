# Disposable independent acquisition only. Production helper input remains disabled.
name: Malinka companion owned official local-map acquisition
on:
  push:
    branches: ["arena/733fc6a9-best-v2"]
    paths: [".github/workflows/malinka-companion-runtime.yml"]
permissions:
  contents: write
jobs:
  acquire:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: BestProjectTeam/BestClient
          ref: cf192e3fb8590dbe2e4f66a191aa6616beff6975
          path: upstream
          submodules: recursive
          persist-credentials: false
      - name: Create temporary acquisition files outside production sources
        shell: python
        run: |
          from pathlib import Path
          Path('runtime_public_layout.cpp').write_text('#include <cstddef>\n#include <cstdio>\n#include <game/client/gameclient.h>\n#include <game/client/prediction/entities/character.h>\n#include <engine/shared/config.h>\n#include <game/mapitems.h>\nint main() {\n std::puts("{");\n std::printf("\\"sizeof_CGameClient\\":%zu,\\n",sizeof(CGameClient));\n std::printf("\\"sizeof_CGameClient::CSnapState\\":%zu,\\n",sizeof(CGameClient::CSnapState));\n std::printf("\\"sizeof_CGameClient::CSnapState::CCharacterInfo\\":%zu,\\n",sizeof(CGameClient::CSnapState::CCharacterInfo));\n std::printf("\\"sizeof_CGameClient::CClientData\\":%zu,\\n",sizeof(CGameClient::CClientData));\n std::printf("\\"sizeof_CCharacterCore\\":%zu,\\n",sizeof(CCharacterCore));\n std::printf("\\"sizeof_CGameWorld\\":%zu,\\n",sizeof(CGameWorld));\n std::printf("\\"sizeof_CWorldCore\\":%zu,\\n",sizeof(CWorldCore));\n std::printf("\\"sizeof_CConfig\\":%zu,\\n",sizeof(CConfig));\n std::printf("\\"sizeof_CTuningParams\\":%zu,\\n",sizeof(CTuningParams));\n std::printf("\\"sizeof_CNetObj_Character\\":%zu,\\n",sizeof(CNetObj_Character));\n std::printf("\\"sizeof_CNetObj_DDNetCharacter\\":%zu,\\n",sizeof(CNetObj_DDNetCharacter));\n std::printf("\\"sizeof_CNetObj_PlayerInput\\":%zu,\\n",sizeof(CNetObj_PlayerInput));\n std::printf("\\"sizeof_CTile\\":%zu,\\n",sizeof(CTile));\n std::printf("\\"sizeof_CMapItemLayerTilemap_v2\\":%zu,\\n",sizeof(CMapItemLayerTilemap_v2));\n std::printf("\\"sizeof_CMapItemLayer\\":%zu,\\n",sizeof(CMapItemLayer));\n std::printf("\\"sizeof_CControls\\":%zu,\\n",sizeof(CControls));\n std::printf("\\"sizeof_CCollision\\":%zu,\\n",sizeof(CCollision));\n std::printf("\\"CGameClient.m_Snap\\":%zu,\\n",offsetof(CGameClient,m_Snap));\n std::printf("\\"CGameClient.m_aClients\\":%zu,\\n",offsetof(CGameClient,m_aClients));\n std::printf("\\"CGameClient.m_aLocalIds\\":%zu,\\n",offsetof(CGameClient,m_aLocalIds));\n std::printf("\\"CGameClient.m_Controls\\":%zu,\\n",offsetof(CGameClient,m_Controls));\n std::printf("\\"CGameClient.m_PredictedWorld\\":%zu,\\n",offsetof(CGameClient,m_PredictedWorld));\n std::printf("\\"CGameClient.m_GameWorld\\":%zu,\\n",offsetof(CGameClient,m_GameWorld));\n std::printf("\\"CGameClient.m_aTuning\\":%zu,\\n",offsetof(CGameClient,m_aTuning));\n std::printf("\\"CGameClient.m_aLocalTuneZone\\":%zu,\\n",offsetof(CGameClient,m_aLocalTuneZone));\n std::printf("\\"CGameClient.m_aReceivedTuning\\":%zu,\\n",offsetof(CGameClient,m_aReceivedTuning));\n std::printf("\\"CGameClient::CSnapState.m_LocalClientId\\":%zu,\\n",offsetof(CGameClient::CSnapState,m_LocalClientId));\n std::printf("\\"CGameClient::CSnapState.m_NumPlayers\\":%zu,\\n",offsetof(CGameClient::CSnapState,m_NumPlayers));\n std::printf("\\"CGameClient::CSnapState.m_pLocalCharacter\\":%zu,\\n",offsetof(CGameClient::CSnapState,m_pLocalCharacter));\n std::printf("\\"CGameClient::CSnapState.m_aCharacters\\":%zu,\\n",offsetof(CGameClient::CSnapState,m_aCharacters));\n std::printf("\\"CGameClient::CSnapState::CCharacterInfo.m_Active\\":%zu,\\n",offsetof(CGameClient::CSnapState::CCharacterInfo,m_Active));\n std::printf("\\"CGameClient::CSnapState::CCharacterInfo.m_Cur\\":%zu,\\n",offsetof(CGameClient::CSnapState::CCharacterInfo,m_Cur));\n std::printf("\\"CGameClient::CSnapState::CCharacterInfo.m_ExtendedData\\":%zu,\\n",offsetof(CGameClient::CSnapState::CCharacterInfo,m_ExtendedData));\n std::printf("\\"CGameClient::CSnapState::CCharacterInfo.m_HasExtendedData\\":%zu,\\n",offsetof(CGameClient::CSnapState::CCharacterInfo,m_HasExtendedData));\n std::printf("\\"CGameClient::CClientData.m_Predicted\\":%zu,\\n",offsetof(CGameClient::CClientData,m_Predicted));\n std::printf("\\"CGameClient::CClientData.m_RenderPos\\":%zu,\\n",offsetof(CGameClient::CClientData,m_RenderPos));\n std::printf("\\"CGameClient::CClientData.m_Active\\":%zu,\\n",offsetof(CGameClient::CClientData,m_Active));\n std::printf("\\"CGameClient::CClientData.m_FreezeEnd\\":%zu,\\n",offsetof(CGameClient::CClientData,m_FreezeEnd));\n std::printf("\\"CGameClient::CClientData.m_DeepFrozen\\":%zu,\\n",offsetof(CGameClient::CClientData,m_DeepFrozen));\n std::printf("\\"CGameClient::CClientData.m_LiveFrozen\\":%zu,\\n",offsetof(CGameClient::CClientData,m_LiveFrozen));\n std::printf("\\"CCharacterCore.m_Pos\\":%zu,\\n",offsetof(CCharacterCore,m_Pos));\n std::printf("\\"CCharacterCore.m_Vel\\":%zu,\\n",offsetof(CCharacterCore,m_Vel));\n std::printf("\\"CCharacterCore.m_HookPos\\":%zu,\\n",offsetof(CCharacterCore,m_HookPos));\n std::printf("\\"CCharacterCore.m_HookDir\\":%zu,\\n",offsetof(CCharacterCore,m_HookDir));\n std::printf("\\"CCharacterCore.m_HookTick\\":%zu,\\n",offsetof(CCharacterCore,m_HookTick));\n std::printf("\\"CCharacterCore.m_HookState\\":%zu,\\n",offsetof(CCharacterCore,m_HookState));\n std::printf("\\"CCharacterCore.m_Id\\":%zu,\\n",offsetof(CCharacterCore,m_Id));\n std::printf("\\"CCharacterCore.m_Input\\":%zu,\\n",offsetof(CCharacterCore,m_Input));\n std::printf("\\"CCharacterCore.m_Tuning\\":%zu,\\n",offsetof(CCharacterCore,m_Tuning));\n std::printf("\\"CCharacterCore.m_FreezeStart\\":%zu,\\n",offsetof(CCharacterCore,m_FreezeStart));\n std::printf("\\"CCharacterCore.m_FreezeEnd\\":%zu,\\n",offsetof(CCharacterCore,m_FreezeEnd));\n std::printf("\\"CCharacterCore.m_IsInFreeze\\":%zu,\\n",offsetof(CCharacterCore,m_IsInFreeze));\n std::printf("\\"CCharacterCore.m_DeepFrozen\\":%zu,\\n",offsetof(CCharacterCore,m_DeepFrozen));\n std::printf("\\"CCharacterCore.m_LiveFrozen\\":%zu,\\n",offsetof(CCharacterCore,m_LiveFrozen));\n std::printf("\\"CCharacterCore.m_Jumped\\":%zu,\\n",offsetof(CCharacterCore,m_Jumped));\n std::printf("\\"CCharacterCore.m_JumpedTotal\\":%zu,\\n",offsetof(CCharacterCore,m_JumpedTotal));\n std::printf("\\"CCharacterCore.m_Jumps\\":%zu,\\n",offsetof(CCharacterCore,m_Jumps));\n std::printf("\\"CCharacterCore.m_Direction\\":%zu,\\n",offsetof(CCharacterCore,m_Direction));\n std::printf("\\"CCharacterCore.m_Angle\\":%zu,\\n",offsetof(CCharacterCore,m_Angle));\n std::printf("\\"CGameWorld.m_Core\\":%zu,\\n",offsetof(CGameWorld,m_Core));\n std::printf("\\"CGameWorld.m_GameTick\\":%zu,\\n",offsetof(CGameWorld,m_GameTick));\n std::printf("\\"CGameWorld.m_LocalClientId\\":%zu,\\n",offsetof(CGameWorld,m_LocalClientId));\n std::printf("\\"CGameWorld.m_WorldConfig\\":%zu,\\n",offsetof(CGameWorld,m_WorldConfig));\n std::printf("\\"CWorldCore.m_apCharacters\\":%zu,\\n",offsetof(CWorldCore,m_apCharacters));\n std::printf("\\"CConfig.m_ClDummy\\":%zu,\\n",offsetof(CConfig,m_ClDummy));\n std::printf("\\"CTuningParams.m_Gravity\\":%zu,\\n",offsetof(CTuningParams,m_Gravity));\n std::printf("\\"CTuningParams.m_GroundControlSpeed\\":%zu,\\n",offsetof(CTuningParams,m_GroundControlSpeed));\n std::printf("\\"CNetObj_Character.m_Tick\\":%zu,\\n",offsetof(CNetObj_Character,m_Tick));\n std::printf("\\"CNetObj_Character.m_X\\":%zu,\\n",offsetof(CNetObj_Character,m_X));\n std::printf("\\"CNetObj_Character.m_Y\\":%zu,\\n",offsetof(CNetObj_Character,m_Y));\n std::printf("\\"CNetObj_Character.m_VelX\\":%zu,\\n",offsetof(CNetObj_Character,m_VelX));\n std::printf("\\"CNetObj_Character.m_VelY\\":%zu,\\n",offsetof(CNetObj_Character,m_VelY));\n std::printf("\\"CNetObj_Character.m_HookState\\":%zu,\\n",offsetof(CNetObj_Character,m_HookState));\n std::printf("\\"CNetObj_Character.m_HookedPlayer\\":%zu,\\n",offsetof(CNetObj_Character,m_HookedPlayer));\n std::printf("\\"CNetObj_DDNetCharacter.m_FreezeEnd\\":%zu,\\n",offsetof(CNetObj_DDNetCharacter,m_FreezeEnd));\n std::printf("\\"CNetObj_DDNetCharacter.m_Flags\\":%zu,\\n",offsetof(CNetObj_DDNetCharacter,m_Flags));\n std::printf("\\"CNetObj_PlayerInput.m_Direction\\":%zu,\\n",offsetof(CNetObj_PlayerInput,m_Direction));\n std::printf("\\"CNetObj_PlayerInput.m_Jump\\":%zu,\\n",offsetof(CNetObj_PlayerInput,m_Jump));\n std::printf("\\"CNetObj_PlayerInput.m_Hook\\":%zu,\\n",offsetof(CNetObj_PlayerInput,m_Hook));\n std::printf("\\"CNetObj_PlayerInput.m_TargetX\\":%zu,\\n",offsetof(CNetObj_PlayerInput,m_TargetX));\n std::printf("\\"CNetObj_PlayerInput.m_TargetY\\":%zu,\\n",offsetof(CNetObj_PlayerInput,m_TargetY));\n std::printf("\\"CTile.m_Index\\":%zu,\\n",offsetof(CTile,m_Index));\n std::printf("\\"CTile.m_Flags\\":%zu,\\n",offsetof(CTile,m_Flags));\n std::printf("\\"CTile.m_Skip\\":%zu,\\n",offsetof(CTile,m_Skip));\n std::printf("\\"CMapItemLayerTilemap_v2.m_Layer\\":%zu,\\n",offsetof(CMapItemLayerTilemap_v2,m_Layer));\n std::printf("\\"CMapItemLayerTilemap_v2.m_Version\\":%zu,\\n",offsetof(CMapItemLayerTilemap_v2,m_Version));\n std::printf("\\"CMapItemLayerTilemap_v2.m_Width\\":%zu,\\n",offsetof(CMapItemLayerTilemap_v2,m_Width));\n std::printf("\\"CMapItemLayerTilemap_v2.m_Height\\":%zu,\\n",offsetof(CMapItemLayerTilemap_v2,m_Height));\n std::printf("\\"CMapItemLayerTilemap_v2.m_Flags\\":%zu,\\n",offsetof(CMapItemLayerTilemap_v2,m_Flags));\n std::printf("\\"CMapItemLayerTilemap_v2.m_Data\\":%zu,\\n",offsetof(CMapItemLayerTilemap_v2,m_Data));\n std::printf("\\"CMapItemLayer.m_Type\\":%zu,\\n",offsetof(CMapItemLayer,m_Type));\n std::printf("\\"CControls.m_aInputData\\":%zu,\\n",offsetof(CControls,m_aInputData));\n std::printf("\\"constant_MAX_CLIENTS\\":%zu,\\n",static_cast<std::size_t>(MAX_CLIENTS));\n std::printf("\\"constant_NUM_DUMMIES\\":%zu,\\n",static_cast<std::size_t>(NUM_DUMMIES));\n std::printf("\\"constant_SERVER_TICK_SPEED\\":%zu,\\n",static_cast<std::size_t>(SERVER_TICK_SPEED));\n std::printf("\\"constant_IClient::STATE_ONLINE\\":%zu,\\n",static_cast<std::size_t>(IClient::STATE_ONLINE));\n std::printf("\\"constant_IClient::STATE_OFFLINE\\":%zu,\\n",static_cast<std::size_t>(IClient::STATE_OFFLINE));\n std::printf("\\"constant_HOOK_IDLE\\":%zu,\\n",static_cast<std::size_t>(HOOK_IDLE));\n std::printf("\\"constant_TILE_AIR\\":%zu,\\n",static_cast<std::size_t>(TILE_AIR));\n std::printf("\\"constant_TILE_SOLID\\":%zu,\\n",static_cast<std::size_t>(TILE_SOLID));\n std::printf("\\"constant_TILE_FREEZE\\":%zu,\\n",static_cast<std::size_t>(TILE_FREEZE));\n std::printf("\\"constant_ENTITY_SPAWN\\":%zu,\\n",static_cast<std::size_t>(ENTITY_SPAWN));\n std::printf("\\"constant_ENTITY_OFFSET\\":%zu,\\n",static_cast<std::size_t>(ENTITY_OFFSET));\n std::printf("\\"constant_MAPITEMTYPE_LAYER\\":%zu,\\n",static_cast<std::size_t>(MAPITEMTYPE_LAYER));\n std::printf("\\"constant_LAYERTYPE_TILES\\":%zu,\\n",static_cast<std::size_t>(LAYERTYPE_TILES));\n std::printf("\\"constant_TILESLAYERFLAG_GAME\\":%zu,\\n",static_cast<std::size_t>(TILESLAYERFLAG_GAME));\n std::puts("\\"runtime_validated\\":false}");\n}\n',encoding="utf-8")
          Path('runtime_owned_map.py').write_text("# Disposable SERVER-side test map. Never patches the official client or its\n# files. The unchanged client obtains it through the ordinary local server.\n# Format: pinned src/engine/shared/datafile.cpp and src/game/mapitems.h.\nimport hashlib, struct, zlib\n\ndef owned_freeze_map(original, layout):\n    assert 36<=len(original)<=2*1024*1024\n    magic,version,total,swap,nt,ni,nd,item_size,data_size=struct.unpack_from('<4s8i',original)\n    assert magic==b'DATA' and version==4 and total==len(original)-16\n    assert 0<nt<=64 and 0<ni<=4096 and 0<nd<=4096\n    item_offsets_at=36+nt*12;data_offsets_at=item_offsets_at+ni*4\n    raw_sizes_at=data_offsets_at+nd*4;item_start=raw_sizes_at+nd*4;data_start=item_start+item_size\n    assert data_start==swap+16 and data_start+data_size==len(original)\n    offsets=list(struct.unpack_from('<'+str(ni)+'i',original,item_offsets_at))\n    raw_offsets=list(struct.unpack_from('<'+str(nd)+'i',original,data_offsets_at))\n    sizes=list(struct.unpack_from('<'+str(nd)+'i',original,raw_sizes_at))\n    assert raw_offsets[0]==0 and raw_offsets==sorted(raw_offsets)\n    assert all(0<=size<=16*1024*1024 for size in sizes) and sum(sizes)<=64*1024*1024\n    layers=[]\n    for offset in offsets:\n        assert 0<=offset<=item_size-8\n        type_id,length=struct.unpack_from('<2i',original,item_start+offset)\n        assert 0<=length<=item_size-offset-8\n        if (type_id>>16)&0xffff!=layout['constant_MAPITEMTYPE_LAYER']:continue\n        data=original[item_start+offset+8:item_start+offset+8+length]\n        def field(name):return struct.unpack_from('<i',data,layout['CMapItemLayerTilemap_v2.'+name])[0]\n        if len(data)<layout['sizeof_CMapItemLayerTilemap_v2']:continue\n        layer_type=struct.unpack_from('<i',data,layout['CMapItemLayerTilemap_v2.m_Layer']+layout['CMapItemLayer.m_Type'])[0]\n        if layer_type!=layout['constant_LAYERTYPE_TILES']:continue\n        if field('m_Flags')&layout['constant_TILESLAYERFLAG_GAME']:\n            layers.append((field('m_Width'),field('m_Height'),field('m_Data')))\n    assert len(layers)==1\n    width,height,index=layers[0]\n    assert 24<=width<=512 and 24<=height<=512 and 0<=index<nd\n    assert layout['sizeof_CTile']==4 and sizes[index]==width*height*4\n    chunks=[]\n    for n,offset in enumerate(raw_offsets):\n        end=raw_offsets[n+1] if n+1<nd else data_size\n        assert 0<=offset<=end<=data_size\n        packed=original[data_start+offset:data_start+end]\n        decoder=zlib.decompressobj();decoded=decoder.decompress(packed,sizes[n]+1)\n        assert len(decoded)==sizes[n] and decoder.eof and not decoder.unconsumed_tail and not decoder.unused_data\n        chunks.append(packed)\n    tiles=bytearray(width*height*4)\n    spawn_x,spawn_y=width//2,5\n    freeze_y=height//3;ground_y=height-3\n    assert freeze_y>spawn_y+2 and freeze_y+4<ground_y\n    def put(x,y,kind):tiles[(y*width+x)*4+layout['CTile.m_Index']]=kind\n    for y in range(height):\n        for x in range(width):\n            if x==0 or x==width-1 or y==0 or y>=ground_y:put(x,y,layout['constant_TILE_SOLID'])\n            elif freeze_y<=y<freeze_y+4:put(x,y,layout['constant_TILE_FREEZE'])\n    put(spawn_x,spawn_y,layout['constant_ENTITY_OFFSET']+layout['constant_ENTITY_SPAWN'])\n    chunks[index]=zlib.compress(bytes(tiles),9)\n    rebuilt=bytearray(original[:data_start]);new_offsets=[];position=0\n    for chunk in chunks:new_offsets.append(position);position+=len(chunk)\n    struct.pack_into('<i',rebuilt,8,data_start+position-16)\n    struct.pack_into('<i',rebuilt,32,position)\n    struct.pack_into('<'+str(nd)+'i',rebuilt,data_offsets_at,*new_offsets)\n    result=bytes(rebuilt)+b''.join(chunks)\n    assert len(result)==struct.unpack_from('<i',result,8)[0]+16\n    check=zlib.decompress(result[data_start+new_offsets[index]:data_start+new_offsets[index]+len(chunks[index])])\n    assert check==tiles\n    geometry={'width':width,'height':height,'spawn_tile':[spawn_x,spawn_y],\n              'spawn_center':[spawn_x*32+16,spawn_y*32+16],'freeze_rows':[freeze_y,freeze_y+3],\n              'ground_row':ground_y,'game_raw_index':index,'tile_bytes_sha256':hashlib.sha256(tiles).hexdigest(),\n              'map_sha256':hashlib.sha256(result).hexdigest(),'base_dm1_sha256':hashlib.sha256(original).hexdigest(),\n              'source':'BestProjectTeam/BestClient@cf192e3fb8590dbe2e4f66a191aa6616beff6975 datafile.cpp/mapitems.h',\n              'client_files_patched':False}\n    return result,geometry\n",encoding="utf-8")
      - name: Measure pinned public layouts and compile owned local test server
        shell: python
        run: |
          try:
              import json, os, re, subprocess, traceback
              from pathlib import Path

              work=Path('build-owned-acquisition');work.mkdir(exist_ok=False)
              upstream=Path('upstream').resolve()
              source=work/'layout-source';source.mkdir()
              generated=source/'generated';generated.mkdir()

              def command(args,name,timeout=540):
                  r=subprocess.run([str(a) for a in args],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,errors='replace',timeout=timeout)
                  (work/(name+'.log')).write_text(r.stdout,encoding='utf-8')
                  (work/(name+'.exit')).write_text(str(r.returncode)+'\n',encoding='utf-8')
                  if r.returncode:
                      errors='\n'.join(line for line in r.stdout.splitlines() if re.search(r'(?:fatal )?error (?:C\d|LNK\d|MSB\d)|CMake Error|error:',line))
                      detail=(errors or r.stdout[-3300:])[:3300]
                      print('::error title='+name+'::'+detail.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
                      raise RuntimeError(name+' exit '+str(r.returncode))
                  print(name+' exit0')
                  return r.stdout

              for script, argument, output in [
                  (['datasrc/compile.py'],'network_header','protocol.h'),
                  (['datasrc/compile.py'],'content_types_header','data_types.h'),
                  (['datasrc/compile.py'],'client_content_header','client_data.h'),
                  (['-m','datasrc.seven.compile'],'network_header','protocol7.h'),
                  (['-m','datasrc.seven.compile'],'client_content_header','client_data7.h'),
                  (['datasrc/crosscompile.py'],'map_header','protocolglue.h')]:
                  data=subprocess.check_output(['python',*script,argument],cwd=upstream)
                  (generated/output).write_bytes(data)
              # The workflow's setup step writes the actual public offsetof probe here.
              (source/'public.cpp').write_bytes(Path('runtime_public_layout.cpp').read_bytes())
              private_targets={'collision':'CCollision','iclient':'IClient','core':'CCharacterCore'}
              for name,typ in private_targets.items():
                  (source/(name+'.cpp')).write_text('#include <game/client/gameclient.h>\nint main(){return sizeof('+typ+')>0?0:1;}\n',encoding='utf-8')
              cmake=r'''
              cmake_minimum_required(VERSION 3.24)
              project(OwnedPublicLayoutAcquisition LANGUAGES CXX)
              set(CMAKE_CXX_STANDARD 20)
              set(CMAKE_CXX_STANDARD_REQUIRED ON)
              set(CMAKE_MSVC_RUNTIME_LIBRARY "MultiThreaded$<$<CONFIG:Debug>:Debug>")
              file(TO_CMAKE_PATH "@U@" U)
              function(add_layout name type)
                add_executable(${name} ${name}.cpp)
                target_compile_definitions(${name} PRIVATE CONF_AUTOUPDATE CONF_DISCORD CONF_DISCORD_DYNAMIC CONF_VIDEORECORDER _ITERATOR_DEBUG_LEVEL=0 NOMINMAX WIN32_LEAN_AND_MEAN)
                target_compile_options(${name} PRIVATE /W3 /utf-8 "/d1reportSingleClassLayout${type}")
                target_include_directories(${name} PRIVATE "${U}/src" "${U}/src/rust-bridge" "${CMAKE_CURRENT_SOURCE_DIR}" "${U}/ddnet-libs/sdl/include/windows" "${U}/ddnet-libs/curl/include" "${U}/ddnet-libs/sqlite3/include" "${U}/ddnet-libs/zlib/include" "${U}/ddnet-libs/discord/include")
              endfunction()
              add_layout(public CGameClient)
              add_layout(collision CCollision)
              add_layout(iclient IClient)
              add_layout(core CCharacterCore)
              '''.replace('@U@',upstream.as_posix())
              (source/'CMakeLists.txt').write_text(cmake,encoding='utf-8')
              command(['cmake','-S',source,'-B',work/'layout','-A','x64'],'layout-configure')
              log=command(['cmake','--build',work/'layout','--config','Release','--parallel','1'],'layout-build')
              public=json.loads(subprocess.check_output([work/'layout/Release/public.exe'],text=True))
              private={};current=None
              for line in log.splitlines():
                  m=re.search(r'^\s*class (CGameClient|CCollision|IClient|CCharacterCore)\s+size\(',line)
                  if m:current=m.group(1);private.setdefault(current,{})
                  m=re.search(r'^\s*(\d+)\s*\|\s+(?!\|)(?:.*\s)?(m_\w+)\s*$',line)
                  if m and current:private[current][m.group(2)]=int(m.group(1))
              required={'CGameClient':['m_pClient','m_pConfig','m_Collision','m_aTuningList'],
                        'CCollision':['m_pLayers','m_Width','m_Height','m_pTiles','m_pFront'],
                        'IClient':['m_State','m_aCurGameTick','m_aPredTick'],
                        'CCharacterCore':['m_pWorld','m_pCollision','m_HookedPlayer']}
              for typ,names in required.items():
                  for member in names:assert member in private.get(typ,{}),(typ,member,private.get(typ))
              metadata={'kind':'pinned-source-layout-candidate-NOT-validated-physics-adapter',
                        'source_commit':'cf192e3fb8590dbe2e4f66a191aa6616beff6975',
                        'defines':['CONF_AUTOUPDATE','CONF_DISCORD','CONF_DISCORD_DYNAMIC','CONF_VIDEORECORDER','_ITERATOR_DEBUG_LEVEL=0'],
                        'public':public,'private':private,'runtime_validated':False,'automatic_avoid_enabled':False}
              (work/'public-full-layout.json').write_text(json.dumps(metadata,indent=2)+'\n',encoding='utf-8')
              compact=json.dumps(metadata,separators=(',',':'))
              for n in range(0,len(compact),3300):
                  print('::notice title=full-source-layout-'+str(n//3300)+'::'+compact[n:n+3300].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
              # An owned test server from exactly the pinned PUBLIC source; not the official client.
              # Do not use this binary to replace a user's client or to claim official authorization.
              command(['rustc','--version'],'rust-version',30)
              command(['cargo','--version'],'cargo-version',30)
              args=['cmake','-S',upstream,'-B',work/'server','-A','x64',
                    '-DCLIENT=OFF','-DSERVER=ON','-DTOOLS=OFF','-DDOWNLOAD_GTEST=OFF',
