              payload=json.dumps(report,separators=(',',':'),allow_nan=False).encode('utf-8');assert len(payload)<=2*1024*1024
              (work/'owned-runtime-report.json').write_bytes(payload)
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(payload).decode('ascii')}).encode(),method='POST',headers={**headers,'Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=60) as f:created=json.load(f)
              summary['transport_blob_sha']=created['sha'];summary['report_bytes']=len(payload);summary['report_sha256']=hashlib.sha256(payload).hexdigest()
              (work/'owned-runtime-summary.json').write_text(json.dumps(summary,indent=2)+'\n',encoding='utf-8')
              print('::notice title=owned-runtime-summary::'+json.dumps(summary,separators=(',',':')))
              if not frames:print('::warning title=owned-runtime-no-frames::'+(report['client_log_tail'][-2000:]+'\n'+report['server_log_tail'][-1200:]).replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          except BaseException:
              import traceback
              from pathlib import Path
              text=traceback.format_exc().replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error title=owned-acquisition-error::'+text[:3300])
              for name in ['owned-server.log','owned-client.log']:
                  p=Path('build-owned-acquisition')/name
                  if p.exists():
                      text=p.read_text(encoding='utf-8',errors='replace')[-3000:]
                      print('::notice title='+name+'-failure-tail::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
              raise
      - name: Keep bounded acquisition metadata and logs (no official binaries)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owned-official-readonly-acquisition-not-Avoid
          path: |
            build-owned-acquisition/*.json
            build-owned-acquisition/*.log
            build-owned-acquisition/*.exit
          retention-days: 7
          if-no-files-found: warn
