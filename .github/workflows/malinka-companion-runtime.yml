 Need(Int(CoreBytes,RemoteLayout::CCharacterCore::m_HookedPlayer)==-1,"hooked player unsupported in this acquisition");\n    const vec2 Position=Vector(CoreBytes,RemoteLayout::CCharacterCore::m_Pos);\n    Need(Position==Vector(Bytes,RemoteLayout::CEntity::m_Pos),"entity/core position disagreement");\n    CNetObj_Character Net{};Net.m_X=static_cast<int>(Position.x);Net.m_Y=static_cast<int>(Position.y);\n    Net.m_HookedPlayer=-1;Net.m_Weapon=WEAPON_GUN;\n    CNetObj_DDNetCharacter Extended{};\n    CCharacter *Player=new CCharacter(&World,ClientId,&Net,&Extended);\n    World.InsertEntity(Player); // From here World owns and destroys it on failure.\n    auto &Core=Player->*Access(CCharacterm_Core{});\n\'\'\'\nfor member in char_private_int:s+=f\'    Player->*Access(CCharacter{member}{{}})=Int(Bytes,RemoteLayout::CCharacter::{member});\\n\'\nfor member in char_private_input:s+=f\'    Player->*Access(CCharacter{member}{{}})=Input(Bytes,RemoteLayout::CCharacter::{member});\\n\'\nfor member in char_public_int:s+=f\'    Player->{member}=Int(Bytes,RemoteLayout::CCharacter::{member});\\n\'\nfor member in char_public_bool:s+=f\'    Player->{member}=Bool(Bytes,RemoteLayout::CCharacter::{member});\\n\'\nfor member in char_public_vec:s+=f\'    Player->{member}=Vector(Bytes,RemoteLayout::CCharacter::{member});\\n\'\ns+=\'    Player->*Access(CCharacterm_Interfering{})=Bool(Bytes,RemoteLayout::CCharacter::m_Interfering);\\n\'\ns+=\'\'\'    Need(Player->*Access(CCharacterm_NumObjectsHit{})>=0 && Player->*Access(CCharacterm_NumObjectsHit{})<=MAX_CLIENTS,"hit object count");\n    Need(Player->*Access(CCharacterm_TuneZone{})==0 && Player->GetOverriddenTuneZone()==0,"tune-zone acquisition bound");\n    for(int Id=0;Id<MAX_CLIENTS;++Id) (Player->*Access(CCharacterm_aHitObjects{}))[Id]=Int(Bytes,RemoteLayout::CCharacter::m_aHitObjects+static_cast<std::size_t>(Id)*4);\n    Player->m_Pos=Position;\n\'\'\'\nfor member in core_int:s+=f\'    Core.{member}=Int(CoreBytes,RemoteLayout::CCharacterCore::{member});\\n\'\nfor member in core_bool:s+=f\'    Core.{member}=Bool(CoreBytes,RemoteLayout::CCharacterCore::{member});\\n\'\nfor member in core_vec:s+=f\'    Core.{member}=Vector(CoreBytes,RemoteLayout::CCharacterCore::{member});\\n\'\ns+=\'\'\'    Core.m_Input=Input(CoreBytes,RemoteLayout::CCharacterCore::m_Input);\n    Core.*Access(CCharacterCorem_MoveRestrictions{})=Int(CoreBytes,RemoteLayout::CCharacterCore::m_MoveRestrictions);\n    static_assert(sizeof(CCharacterCore::CWeaponStat)==16);\n    // Candidate nested offsets are compile-asserted, then checked with MSVC in\n    // the native fixture before this importer can be used for ordinary input.\n    static_assert(offsetof(CCharacterCore::CWeaponStat,m_AmmoRegenStart)==0 && offsetof(CCharacterCore::CWeaponStat,m_Ammo)==4 && offsetof(CCharacterCore::CWeaponStat,m_Ammocost)==8 && offsetof(CCharacterCore::CWeaponStat,m_Got)==12);\n    for(int Weapon=0;Weapon<NUM_WEAPONS;++Weapon)\n    {\n        const auto At=RemoteLayout::CCharacterCore::m_aWeapons+static_cast<std::size_t>(Weapon)*16;\n        Core.m_aWeapons[Weapon].m_AmmoRegenStart=Int(CoreBytes,At);\n        Core.m_aWeapons[Weapon].m_Ammo=Int(CoreBytes,At+4);\n        Core.m_aWeapons[Weapon].m_Ammocost=Int(CoreBytes,At+8);\n        Core.m_aWeapons[Weapon].m_Got=Bool(CoreBytes,At+12);\n    }\n    Core.m_Ninja.m_ActivationDir=Vector(CoreBytes,RemoteLayout::CCharacterCore::m_Ninja);\n    Core.m_Ninja.m_ActivationTick=Int(CoreBytes,RemoteLayout::CCharacterCore::m_Ninja+8);\n    Core.m_Ninja.m_CurrentMoveTime=Int(CoreBytes,RemoteLayout::CCharacterCore::m_Ninja+12);\n    Core.m_Ninja.m_OldVelAmount=Int(CoreBytes,RemoteLayout::CCharacterCore::m_Ninja+16);\n    for(int Param=0;Param<CTuningParams::Num();++Param)\n    {\n        const int Value=Int(CoreBytes,RemoteLayout::CCharacterCore::m_Tuning+static_cast<std::size_t>(Param)*4);\n        Need(Value>-100000000 && Value<100000000,"excessive tuning");\n        Core.m_Tuning.NetworkArray()[Param]=Value;\n    }\n    World.TuningList()[0]=Core.m_Tuning;\n    Player->SetCoreWorld(&World); // Fresh OWN pointers/callback; no remote pointer escapes.\n    return Player;\n}\ninline void Step(CGameWorld &World, int ClientId, const CNetObj_PlayerInput &NewInput)\n{\n    Need(World.m_GameTick>=0 && World.m_GameTick<std::numeric_limits<int>::max(),"world tick range");\n    auto *Player=World.GetCharacterById(ClientId);Need(Player!=nullptr,"missing character before direct input");\n    Player->OnDirectInput(&NewInput);\n    ++World.m_GameTick;\n    Player=World.GetCharacterById(ClientId);Need(Player!=nullptr,"character removed by direct input");\n    Player->OnPredictedInput(&NewInput);\n    World.Tick();\n    Need(World.GetCharacterById(ClientId)!=nullptr,"character removed during tick");\n}\n} // namespace Replica\n\'\'\'\n(root/\'physics_import.h\').write_text(s)\n(root/\'physics-field-spec.json\').write_text(json.dumps({\'char_private_int\':char_private_int,\'char_private_input\':char_private_input,\'char_public_int\':char_public_int,\'char_public_bool\':char_public_bool,\'char_public_vec\':char_public_vec,\'core_int\':core_int,\'core_bool\':core_bool,\'core_vec\':core_vec,\'world_flags\':world_flags},indent=2)+\'\\n\')\nprint(\'generated importer\',len(s.encode()),\'bytes; no pointer/container copies\')\n',encoding="utf-8")
          Path('.artifacts/external-helper/physics_make_trace.py').parent.mkdir(parents=True,exist_ok=True)
          Path('.artifacts/external-helper/physics_make_trace.py').write_text("from pathlib import Path\nimport base64,json,struct,hashlib\nroot=Path('.artifacts/external-helper');r=json.loads((root/'runtime-3-report.json').read_text());g=r['map'];spec=json.loads((root/'physics-field-spec.json').read_text())\n# The map was served by our pinned test server and fetched through the client's\n# normal map protocol. Reconstruct its exact game tile bytes from the owned recipe.\nw,h=g['width'],g['height'];tiles=bytearray(w*h*4)\nfor y in range(h):\n for x in range(w):\n  if x==0 or x==w-1 or y==0 or y>=g['ground_row']:tiles[(y*w+x)*4]=1\n  elif g['freeze_rows'][0]<=y<=g['freeze_rows'][1] and g['freeze_columns'][0]<=x<=g['freeze_columns'][1]:tiles[(y*w+x)*4]=9\nsx,sy=g['spawn_tile'];tiles[(sy*w+sx)*4]=192\nassert hashlib.sha256(tiles).hexdigest()==g['tile_bytes_sha256']\nframes=[];seen=set()\nfor f in r['samples']:\n if not f.get('coherent_candidate') or f['world_tick'] in seen:continue\n seen.add(f['world_tick']);frames.append(f)\nassert 30<=len(frames)<=512\nout=bytearray(b'MALPTR01')+struct.pack('<4I',w,h,len(tiles),len(frames))+tiles\nfor f in frames:\n data=base64.b64decode(f['character_bytes_b64']);assert len(data)==r['layout']['public']['sizeof_CCharacter']\n out+=struct.pack('<2i',f['world_tick'],f['local_id'])\n out+=struct.pack('<10i',*f['controls'])\n out+=struct.pack('<15i',*[f['world_flags'][m]for m in spec['world_flags']])\n out+=data\np=Path('build/external-physics-probe/runtime-3-trace.bin');p.write_bytes(out)\nmetadata={'kind':'owned-exact-official-raw-character-trace-for-independent-replica-check-NOT-Avoid','source_run':43017692183,'source_job':130512762553,'frames':len(frames),'bytes':len(out),'sha256':hashlib.sha256(out).hexdigest(),'map_sha256':g['map_sha256'],'raw_character_length':1512}\n(root/'physics-trace-3-metadata.json').write_text(json.dumps(metadata,indent=2)+'\\n');print(json.dumps(metadata,indent=2))\n",encoding="utf-8")
      - name: Measure pinned public layouts and compile owned local test server
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          try:
              import json, os, re, subprocess, traceback
              from pathlib import Path

              work=Path('build-owned-acquisition');work.mkdir(exist_ok=False)
              upstream=Path('upstream').resolve()
              source=work/'layout-source';source.mkdir()
              generated=source/'generated';generated.mkdir()

              def command(args,name,timeout=540):
                  r=subprocess.run([str(a) for a in args],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,errors='replace',timeout=timeout)
                  (work/(name+'.log')).write_text(r.stdout,encoding='utf-8')
                  (work/(name+'.exit')).write_text(str(r.returncode)+'\n',encoding='utf-8')
                  if r.returncode:
                      errors='\n'.join(line for line in r.stdout.splitlines() if re.search(r'(?:fatal )?error (?:C\d|LNK\d|MSB\d)|CMake Error|error:',line))
                      detail=(errors or r.stdout[-3300:])[:3300]
                      print('::error title='+name+'::'+detail.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
                      raise RuntimeError(name+' exit '+str(r.returncode))
                  print(name+' exit0')
                  return r.stdout

              for script, argument, output in [
                  (['datasrc/compile.py'],'network_header','protocol.h'),
                  (['datasrc/compile.py'],'content_types_header','data_types.h'),
                  (['datasrc/compile.py'],'client_content_header','client_data.h'),
                  (['-m','datasrc.seven.compile'],'network_header','protocol7.h'),
                  (['-m','datasrc.seven.compile'],'client_content_header','client_data7.h'),
                  (['datasrc/crosscompile.py'],'map_header','protocolglue.h')]:
                  data=subprocess.check_output(['python',*script,argument],cwd=upstream)
                  (generated/output).write_bytes(data)
              # The workflow's setup step writes the actual public offsetof probe here.
              (source/'public.cpp').write_bytes(Path('runtime_public_layout.cpp').read_bytes())
              private_targets={'collision':'CCollision','iclient':'IClient','core':'CCharacterCore','character':'CCharacter','entity':'CEntity','world':'CGameWorld','binds':'CBinds','ego':'CEgoTilesPrediction'}
              for name,typ in private_targets.items():
                  (source/(name+'.cpp')).write_text('#include <game/client/gameclient.h>\n#include <game/client/prediction/entities/character.h>\n#include <game/client/components/bestclient/ego_tiles_prediction.h>\nint main(){return sizeof('+typ+')>0?0:1;}\n',encoding='utf-8')
              cmake=r'''
              cmake_minimum_required(VERSION 3.24)
              project(OwnedPublicLayoutAcquisition LANGUAGES CXX)
              set(CMAKE_CXX_STANDARD 20)
              set(CMAKE_CXX_STANDARD_REQUIRED ON)
              set(CMAKE_MSVC_RUNTIME_LIBRARY "MultiThreaded$<$<CONFIG:Debug>:Debug>")
              file(TO_CMAKE_PATH "@U@" U)
              function(add_layout name type)
                add_executable(${name} ${name}.cpp)
