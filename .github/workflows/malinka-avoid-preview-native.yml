name: Malinka external Avoid preview native MSVC check
on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "tools/malinka-helper/**"
      - ".github/workflows/malinka-avoid-preview-native.yml"
  pull_request:
    paths:
      - "tools/malinka-helper/**"
      - ".github/workflows/malinka-avoid-preview-native.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: malinka-avoid-preview-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-msvc:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      # Keep the pinned public source byte-identical to Git blobs on Windows.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out the exact public prediction source and recursive dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: BestProjectTeam/BestClient
          ref: cf192e3fb8590dbe2e4f66a191aa6616beff6975
          path: upstream
          submodules: recursive
          persist-credentials: false
      - name: Verify pinned public source and ddnet-libs identity
        shell: pwsh
        run: |
          $source = (git -C upstream rev-parse HEAD).Trim()
          $libs = (git -C upstream/ddnet-libs rev-parse HEAD).Trim()
          if ($source -ne 'cf192e3fb8590dbe2e4f66a191aa6616beff6975') { throw "unexpected upstream commit: $source" }
          if ($libs -ne 'c0e6703fbcdbe03df2f26875427ec3951ce4ec21') { throw "unexpected ddnet-libs commit: $libs" }
          Write-Host "pinned-source=$source ddnet-libs=$libs"
      - name: Configure isolated x64 preview target with MSVC
        shell: pwsh
        run: |
          $log = "avoid-preview-configure.log"
          & cmake -S tools/malinka-helper -B build/avoid-preview -A x64 `
            -DMALINKA_BUILD_AVOID_PREVIEW=ON `
            "-DMALINKA_PINNED_SOURCE=$env:GITHUB_WORKSPACE/upstream" *> $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content $log -Tail 35) -join "`n"
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A').Replace('::', ':')
            Write-Output ("::error title=CMake configure details::$tail")
            exit $code
          }
          Get-Content $log
      - name: Build the independent preview executable (compile verification only)
        shell: pwsh
        run: |
          $log = "avoid-preview-build.log"
          & cmake --build build/avoid-preview --config Release --target MalinkaAvoidPreview --parallel 2 *> $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content $log -Tail 35) -join "`n"
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A').Replace('::', ':')
            Write-Output ("::error title=MSVC build details::$tail")
            exit $code
          }
          Get-Content $log
      - name: Run native MSVC candidate-layout self-check without opening a process or sending input
        shell: pwsh
        run: |
          & "build/avoid-preview/Release/MalinkaAvoidPreview.exe" --self-test-abi
          if ($LASTEXITCODE -ne 0) { throw "native ABI self-check exited $LASTEXITCODE" }
          Get-FileHash "build/avoid-preview/Release/MalinkaAvoidPreview.exe" -Algorithm SHA256
      - name: Prepare the observe-only-first experimental Windows bundle
        shell: pwsh
        run: |
          $exe = "build/avoid-preview/Release/MalinkaAvoidPreview.exe"
          $bundle = "build/avoid-preview/package"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item -LiteralPath $exe -Destination $bundle
          Copy-Item -LiteralPath "tools/malinka-helper/avoid/OBSERVE-ONLY.cmd" -Destination $bundle
          Copy-Item -LiteralPath "tools/malinka-helper/avoid/TEST-READ-ME.txt" -Destination (Join-Path $bundle "READ-ME-FIRST.txt")
          Copy-Item -LiteralPath "LICENSE" -Destination $bundle
          Copy-Item -LiteralPath "license.txt" -Destination $bundle
          $sha = (Get-FileHash -LiteralPath (Join-Path $bundle "MalinkaAvoidPreview.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  MalinkaAvoidPreview.exe" | Set-Content -LiteralPath (Join-Path $bundle "SHA256SUMS.txt") -Encoding ascii
          @"
          repository_commit=$env:GITHUB_SHA
          pinned_public_source=cf192e3fb8590dbe2e4f66a191aa6616beff6975
          pinned_ddnet_libs=c0e6703fbcdbe03df2f26875427ec3951ce4ec21
          build=MSVC x64 Release
          self_test=native-abi-self-test-passed
          input_default=disabled
          package=experimental-not-a-release
          "@ | Set-Content -LiteralPath (Join-Path $bundle "BUILD-INFO.txt") -Encoding ascii
          Get-ChildItem -LiteralPath $bundle | Select-Object Name,Length
      - name: Upload time-limited experimental test bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MalinkaAvoidPreview-experimental-win64
          path: build/avoid-preview/package/
          retention-days: 30
          if-no-files-found: error
