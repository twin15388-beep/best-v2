andidates.empty());\n  const auto unset=InspectProcess(GetCurrentProcessId(),{},0);Check(unset.process && !unset.process->error.empty() && unset.file.path.empty());\n  const auto timed=InspectFileReport(own.data());Check(timed.file.sha256==file.sha256 && timed.inspection_duration_ms.has_value() && !timed.inspection_finished_at_utc.empty());\n  const std::array<std::byte,16> expected{std::byte{1},std::byte{2},std::byte{3}};std::array<std::byte,16> actual{};\n  Check(ReadExact(GetCurrentProcess(),reinterpret_cast<std::uintptr_t>(expected.data()),actual));Check(actual==expected);\n  Check(!ReadExact(GetCurrentProcess(),0,actual));Check(!ReadExact(GetCurrentProcess(),MAX_USER_ADDRESS,actual));Check(!ReadExact(GetCurrentProcess(),reinterpret_cast<std::uintptr_t>(expected.data()),std::span<std::byte>{}));\n  SYSTEM_INFO sys{};GetSystemInfo(&sys);const SIZE_T page=sys.dwPageSize;\n  auto *memory=static_cast<std::byte*>(VirtualAlloc(nullptr,page*2,MEM_RESERVE|MEM_COMMIT,PAGE_READWRITE));Check(memory!=nullptr);\n  struct Memory {void*p;~Memory(){VirtualFree(p,0,MEM_RELEASE);}} release{memory};\n  std::fill_n(memory,page*2,std::byte{0x31});DWORD old{};Check(VirtualProtect(memory+page,page,PAGE_NOACCESS,&old)!=FALSE);\n  Check(!ReadExact(GetCurrentProcess(),reinterpret_cast<std::uintptr_t>(memory+page-8),actual));\n  Check(VirtualProtect(memory+page,page,PAGE_READWRITE,&old)!=FALSE);\n  constexpr std::uint64_t marker=0x123456780ULL;std::memcpy(memory,&marker,8);\n  auto scan=ScanPrivatePointers(GetCurrentProcess(),marker);Check(scan.candidates.size()<=32);Check(scan.bytes_attempted<=512ULL*1024*1024 && scan.bytes_read<=scan.bytes_attempted);\n  Check(std::find(scan.candidates.begin(),scan.candidates.end(),reinterpret_cast<std::uintptr_t>(memory))!=scan.candidates.end());\n  Check(scan.duration_ms.has_value());Check(!scan.started_at_utc.empty() && !scan.finished_at_utc.empty());\n  std::stop_source cancel;cancel.request_stop();Check(ScanPrivatePointers(GetCurrentProcess(),marke