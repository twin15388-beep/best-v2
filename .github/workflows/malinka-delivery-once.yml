name: One-shot Windows artifact delivery

on:
  push:
    branches: ["arena/733fc6a9-best-v2"]
    paths: [".github/workflows/malinka-delivery-once.yml"]

permissions:
  actions: read
  contents: write

jobs:
  transfer:
    name: Transfer verified Windows artifact without Azure download URL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download the existing successful Windows artifact on the runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh run view 42887818609 --json headSha --jq .headSha)" = 0a0eeed0b463ade41801f2e76c0aaca5e1f338e9
          test "$(gh run view 42887818609 --json conclusion --jq .conclusion)" = success
          gh run download 42887818609 --name malinka-windows-x86_64 --dir build/artifact
      - name: Check package identity and transfer bounded chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/delivery-transfer
          cat > build/delivery-transfer/transfer.py <<'PYTHON'
          # One-shot transfer of an existing public CI artifact; no commit/ref contains
          # the payload. Chunked unreferenced blob objects avoid the failed Azure URL.
          import base64,hashlib,json,re,struct,subprocess,zipfile
          from pathlib import Path
          ROOT=Path('build/delivery-transfer');ROOT.mkdir(parents=True,exist_ok=True)
          A=Path('build/artifact');P=A/'bestclient-malinka-windows-x86_64.zip'
          EXPECTED_COMMIT='0a0eeed0b463ade41801f2e76c0aaca5e1f338e9'
          assert (A/'build-environment.txt').read_text().splitlines()[0]==EXPECTED_COMMIT
          sidecar=(P.with_name(P.name+'.sha256')).read_text().strip().split()
          assert len(sidecar)==2 and re.fullmatch('[0-9a-f]{64}',sidecar[0]) and sidecar[1]==P.name
          assert 0<P.stat().st_size<=512*1024*1024
          h=hashlib.sha256()
          with P.open('rb') as f:
           for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
          assert h.hexdigest()==sidecar[0]
          with zipfile.ZipFile(P) as z:
           infos=z.infolist();assert 0<len(infos)<=10000 and sum(i.file_size for i in infos)<=2*1024*1024*1024
           assert all(i.file_size<=512*1024*1024 and not i.filename.startswith('/') and '..' not in i.filename.split('/') for i in infos)
           assert z.testzip() is None
           assert 'DDNet.exe' in z.namelist() and 'bestclient-updater.exe' in z.namelist() and 'malinka-update.manifest' in z.namelist()
           exe=z.read('DDNet.exe');assert exe[:2]==b'MZ';pe=struct.unpack_from('<I',exe,0x3c)[0]
           assert pe<=len(exe)-26 and exe[pe:pe+4]==b'PE\0\0' and struct.unpack_from('<H',exe,pe+4)[0]==0x8664 and struct.unpack_from('<H',exe,pe+24)[0]==0x20b
           assert b'BestClient-Malinka:api=1;version=0.1.0;upstream=cf192e3fb8590dbe2e4f66a191aa6616beff6975' in exe
           meta={'artifact_run':42887818609,'artifact_id':13796858394,'source_commit':EXPECTED_COMMIT,'file_name':P.name,'size_bytes':P.stat().st_size,'sha256':h.hexdigest(),'zip_entries':len(infos),'exe_size_bytes':len(exe),'exe_sha256':hashlib.sha256(exe).hexdigest(),'machine':'AMD64','chunks':[]}
          with P.open('rb') as f:
           while b:=f.read(24*1024*1024):
            payload=ROOT/'blob-input.json';payload.write_text(json.dumps({'content':base64.b64encode(b).decode('ascii'),'encoding':'base64'}),encoding='ascii')
            answer=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/twin15388-beep/best-v2/git/blobs','--input',str(payload)],text=True))
            oid=answer['sha'];assert re.fullmatch('[0-9a-f]{40}',oid) and oid==hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
            meta['chunks'].append({'index':len(meta['chunks']),'size_bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'git_blob_sha':oid})
            payload.unlink()
          (ROOT/'transfer.json').write_text(json.dumps(meta,indent=2),encoding='ascii')
          print('::notice title=Verified Windows transfer metadata::'+json.dumps(meta,separators=(',',':')),flush=True)
          PYTHON
          python3 build/delivery-transfer/transfer.py
      - name: Retain transfer metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-transfer-metadata
          path: build/delivery-transfer/transfer.json
          retention-days: 7
          if-no-files-found: ignore
